# Generated by `hrc herdr manifest`. Do not edit by hand.
#
# The source of truth is `crates/hrc-herdr/src/manifest.rs`, and
# `crates/hrc-cli/tests/plugin_manifest.rs` fails if this file and that
# module disagree. Regenerate with:
#
#     cargo run --quiet --bin hrc -- herdr manifest > herdr-plugin.toml

id = "herdr-remote-channel"
name = "Herdr Remote Channel"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Secure asynchronous communication between independent Herdr installations."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["sh", "herdr/build.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "herdr/build.ps1"]
platforms = ["windows"]

[[startup]]
command = ["bin/hrc", "herdr", "startup"]

[[actions]]
id = "inbox"
title = "Remote channel inbox"
contexts = ["workspace", "pane"]
command = ["bin/hrc", "herdr", "action", "inbox"]

[[events]]
on = "workspace.focused"
command = ["bin/hrc", "herdr", "event"]

[[panes]]
id = "inbox"
title = "Remote channel inbox"
placement = "split"
command = ["bin/hrc", "herdr", "pane", "inbox"]

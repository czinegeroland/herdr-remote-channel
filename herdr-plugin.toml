id = "herdr-remote-channel"
name = "Herdr Remote Channel"
version = "0.2.5"
min_herdr_version = "0.8.0"
description = "Secure asynchronous communication between independent Herdr installations."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cmd", "/c", "npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-remote-channel@0.2.5"]
platforms = ["windows"]

[[build]]
command = ["npm", "install", "--no-save", "--no-audit", "--no-fund", "herdr-remote-channel@0.2.5"]
platforms = ["linux", "macos"]

[[build]]
command = ["cmd", "/c", "npx", "--yes", "skills", "add", "czinegeroland/herdr-remote-channel", "--skill", "herdr-remote-channel", "--agent", "claude-code", "--global", "--yes"]
platforms = ["windows"]

[[build]]
command = ["npx", "--yes", "skills", "add", "czinegeroland/herdr-remote-channel", "--skill", "herdr-remote-channel", "--agent", "claude-code", "--global", "--yes"]
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "startup"]

[[actions]]
id = "inbox"
title = "Remote channel inbox"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "inbox"]

[[actions]]
id = "setup"
title = "Remote channel setup"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "setup"]

[[actions]]
id = "compose"
title = "Remote channel compose"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "compose"]

[[actions]]
id = "context"
title = "Remote channel context"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "context"]

[[actions]]
id = "joins"
title = "Remote channel join requests"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "joins"]

[[actions]]
id = "members"
title = "Remote channel members"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "members"]

[[actions]]
id = "review"
title = "Remote channel review"
contexts = ["workspace", "pane"]
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "action", "review"]

[[events]]

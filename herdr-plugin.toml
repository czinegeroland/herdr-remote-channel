command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "event"]

[[panes]]
id = "inbox"
title = "Remote channel inbox"
placement = "split"
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "pane", "inbox"]

[[panes]]
id = "setup"
title = "Remote channel setup"
placement = "popup"
width = "80%"
height = "80%"
command = ["node", "node_modules/herdr-remote-channel/bin.js", "herdr", "pane", "setup"]


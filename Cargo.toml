[workspace]
resolver = "3"
members = [
    "crates/hrc-protocol",
    "crates/hrc-crypto",
    "crates/hrc-storage",
    "crates/hrc-transport",
    "crates/hrc-transport-git",
    "crates/hrc-core",
    "crates/hrc-ipc",
    "crates/hrc-herdr",
    "crates/hrc-tui",
    "crates/hrc-cli",
]

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/czinegeroland/herdr-remote-channel"

[workspace.dependencies]
hrc-protocol = { path = "crates/hrc-protocol" }
hrc-crypto = { path = "crates/hrc-crypto" }
hrc-storage = { path = "crates/hrc-storage" }
hrc-transport = { path = "crates/hrc-transport" }
hrc-transport-git = { path = "crates/hrc-transport-git" }
hrc-core = { path = "crates/hrc-core" }
hrc-ipc = { path = "crates/hrc-ipc" }
hrc-herdr = { path = "crates/hrc-herdr" }
hrc-tui = { path = "crates/hrc-tui" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly, not to a compatible range. Requirement HRC-TECH-005 asks
# for a *pinned* RFC 8785 implementation because canonicalization is
# consensus-critical: two peers that serialize the same payload differently
# compute different digests and reject each other's signatures. A patch
# release that changed one escaping decision would break every channel
# silently, so the version moves only when someone re-runs the vectors.
serde_jcs = "=0.2.0"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
thiserror = "2"
age = "0.12"
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
hmac = "0.13"
crossterm = "0.29"
interprocess = { version = "2", features = ["tokio"] }
ratatui = "0.30"
# `signal` is what makes graceful shutdown possible: PRD requirement
# HRC-TECH-003 asks Tokio to own cancellation, and a daemon that can only be
# killed cannot finish the tick it is in the middle of.
tokio = { version = "1", features = [
    "io-util",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
    "macros",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
secrecy = "0.10"
tempfile = "3"
# The Herdr plugin manifest is the host's format, not ours: `herdr-plugin.toml`
# is what Herdr reads to discover and install a plugin. Emitting it with a real
# serializer rather than a hand-rolled writer means a quoted string or an array
# of argv is escaped by something that has been tested. Serialization only —
# nothing here parses TOML.
toml = { version = "1", default-features = false, features = [
    "display",
    "serde",
    "std",
] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Release artifacts (PRD requirements HRC-TECH-011 and HRC-TECH-012,
# section 13.2).
#
# `cargo dist` reads this. The four targets are the ones section 13.2
# requires; Linux ARM64 is added when CI and dependency support are verified,
# which `rusqlite`'s bundled SQLite makes a cross-compilation question rather
# than a configuration one.
#
# Installing must not compile Rust on the user's machine, so the artifacts are
# prebuilt executables rather than a source package, and the installers below
# fetch and verify one rather than invoking cargo.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Section 13.2: installation verifies a checksum before it trusts an artifact.
checksum = "sha256"
# `scripts/install.sh` and `scripts/install.ps1` are this project's installers
# and are covered by `crates/hrc-cli/tests/release_fixture.rs`, so no
# generated installer competes with them; `installers` is deliberately unset.
#
# `cargo dist` owns `.github/workflows/release.yml`, which is regenerated with
# `dist generate`. One line of it is then changed by hand every time: the
# generated trigger includes `pull_request`, and this repository is private
# with billed Actions minutes (decision DEC-049), so release machinery runs on
# tags and on demand only. `allow-dirty` records that the file is not
# byte-identical to generated output.
allow-dirty = ["ci"]

# Release builds are optimized for a single self-contained executable that
# starts fast (PRD section 28): one codegen unit and fat LTO.
#
# Panics deliberately still unwind. Aborting would save a little size, but
# `hrc daemon` is resident and serves both local interfaces from Tokio tasks,
# where an unwinding panic takes down one task and an aborting one takes down
# the daemon. A single malformed local request should not stop a channel
# synchronizing.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[workspace]
resolver = "3"
members = [
    "crates/hrc-protocol",
    "crates/hrc-crypto",
    "crates/hrc-storage",
    "crates/hrc-transport",
    "crates/hrc-transport-git",
    "crates/hrc-core",
    "crates/hrc-herdr",
    "crates/hrc-tui",
    "crates/hrc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/czinegeroland/herdr-remote-channel"

[workspace.dependencies]
hrc-protocol = { path = "crates/hrc-protocol" }
hrc-crypto = { path = "crates/hrc-crypto" }
hrc-storage = { path = "crates/hrc-storage" }
hrc-transport = { path = "crates/hrc-transport" }
hrc-transport-git = { path = "crates/hrc-transport-git" }
hrc-core = { path = "crates/hrc-core" }
hrc-herdr = { path = "crates/hrc-herdr" }
hrc-tui = { path = "crates/hrc-tui" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
thiserror = "2"
age = "0.12"
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
secrecy = "0.10"
tempfile = "3"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

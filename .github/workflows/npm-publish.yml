name: Publish to npm

# Publishes the `hrc` CLI to npm after a release is created.
#
# Deliberately separate from `release.yml`, which `cargo dist` generates and
# owns. Everything here is hand-written, so nothing in it has to be re-applied
# after a `dist generate`, and the verification below lives in code this
# repository controls rather than in a patch over generated output.
#
# `cargo dist` can emit an npm installer itself. It is not used, because it
# fetches the release archive over HTTPS at install time and checks nothing.
# This project publishes SHA-256 checksums so that an artifact can be refused;
# a channel that ignores them throws that away. `build-npm-packages.mjs`
# verifies every archive against its published checksum and bundles the
# executables into the packages, so npm serves the bytes under its own
# integrity hash and no install ever fetches from GitHub.
#
# Triggered by the Release workflow finishing rather than by
# `release: published`. That event never arrives: `cargo dist` creates the
# release with `GITHUB_TOKEN`, and GitHub deliberately does not raise
# workflow-triggering events for anything done with that token, to stop
# workflows recursing. A `release:` trigger here looks correct and silently
# never fires, which is how the first release reached GitHub with nothing
# published to npm.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # So a failed publish can be retried without cutting another tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string
      dry-run:
        description: Build and verify the packages without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only for a Release run that succeeded, and only for a version tag: the
    # Release workflow can also be dispatched by hand on a branch, and
    # publishing whatever that produced would be wrong.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Check out the release
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org

      - name: Work out which tag to publish
        id: release
        env:
          # `head_branch` on a workflow_run carries the ref the run was for,
          # which for a tag-triggered Release run is the tag itself.
          EVENT_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          [ -n "$tag" ] || { echo "no tag to publish" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download the release archives and their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'hrc-cli-*'
          ls -la artifacts

      # Refuses a tampered or unchecksummed archive, and refuses to publish at
      # all unless every supported platform is present: a release where one
      # platform silently went missing would install for some people and not
      # others, which is worse than not publishing.
      - name: Build and verify the npm packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: node scripts/build-npm-packages.mjs --version "$VERSION" --artifacts artifacts --out npm-dist

      - name: Check the built shim runs the bundled binary
        shell: bash
        run: |
          set -euo pipefail
          cd npm-dist/herdr-remote-channel
          mkdir -p node_modules
          cp -r ../linux-x64 node_modules/herdr-remote-channel-linux-x64
          test "$(node bin.js --version)" = "hrc ${{ steps.release.outputs.version }}"
          echo "the packaged shim runs the packaged binary"

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Every path is written with a leading `./`. npm reads a bare `a/b`
          # argument as the GitHub shorthand `owner/repo`, not as a directory,
          # so `npm publish npm-dist/herdr-remote-channel` went looking for
          # `ssh://git@github.com/npm-dist/herdr-remote-channel.git` and failed
          # on a public key. The platform packages only escaped it because the
          # `npm-dist/*/` glob leaves a trailing slash.
          publish() {
            local dir="$1"
            local name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"

            # A publish is not all-or-nothing: npm creates each package
            # separately, and a version, once created, is immutable. A run that
            # fails partway therefore leaves some of these already published,
            # and a plain retry would abort on the first one with
            # `EPUBLISHCONFLICT`. Skipping what already exists is what makes
            # the retry this workflow advertises actually work.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              return 0
            fi

            # npm needs a moment after a brand-new package name is created
            # before it will accept the next one, and answers a publish that
            # arrives too early with `E409 Failed to save packument`. Five new
            # names in a row hits it every time: each run published exactly
            # one and was refused the next. It is a property of the registry
            # rather than of these packages, so it is retried rather than
            # reported.
            local attempt=1 delay=20
            while true; do
              echo "publishing $name@$version (attempt $attempt)"
              if npm publish --access public "./$dir"; then
                return 0
              fi

              # A refused publish may still have landed: `E409` reports a
              # packument that failed to save, and the registry is the only
              # authority on whether it did. Asking costs one request and
              # avoids retrying a publish that already succeeded, which would
              # fail as `EPUBLISHCONFLICT` and end the run.
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is published despite the error"
                return 0
              fi

              if [ "$attempt" -ge 6 ]; then
                echo "giving up on $name@$version after $attempt attempts" >&2
                return 1
              fi

              echo "retrying $name@$version in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # Platform packages first. The root package depends on them, and an
          # `npm install` that resolved before they existed would fail.
          for dir in npm-dist/*/; do
            [ "$(basename "$dir")" = "herdr-remote-channel" ] && continue
            publish "${dir%/}"
          done

          publish npm-dist/herdr-remote-channel

name: Build and test

# The PRD traceability workflow runs on `pull_request_target` so it can
# execute trusted base-branch code (PRD decision DEC-014). This workflow
# compiles and runs pull-request code, so it deliberately uses the untrusted
# `pull_request` trigger with a read-only token instead.
#
# This repository is private, so every minute is billed and the platforms are
# not billed equally: Linux is the base rate, Windows twice it, macOS ten
# times it. A full three-platform matrix on both the pull request and the
# merge that follows costs roughly two dollars a change, about two thirds of
# it on macOS alone.
#
# Public Rust projects usually do run a full matrix on every pull request —
# tokio, ripgrep and friends all do — but Actions is free for them. For a
# private repository the ordinary pattern is fast feedback on one platform
# per change, with the other platforms run deliberately. That is the shape
# here: this workflow is Linux only, and `cross-platform.yml` runs Windows
# and macOS when someone asks it to.
#
# A change that touches no Rust and no agent skill runs none of it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Registry dependencies build with `--cap-lints allow`, so this denies
  # warnings in workspace crates only.
  RUSTFLAGS: -D warnings

jobs:
  # Decides what the rest of the run needs to do. Cheap: checkout and a diff.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - name: Check out enough history to diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Whether anything the Rust jobs read has changed. A schedule or a
          # manual run always builds: the point of those is to catch drift
          # that no diff would show, such as a dependency yanked upstream.
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

          # `.agents/` is in this list because the skill contract tests read
          # SKILL.md, so a skill-only change really can fail the suite.
          # `docs/` is not: nothing under it is read at test time.
          if echo "$changed" | grep -Eq '^(crates/|Cargo\.toml|Cargo\.lock|rust-toolchain|\.agents/|\.github/workflows/build-and-test\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust, manifest, or agent-skill changes; skipping the build."
          fi

  lint:
    name: Format and lint
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # Reads the exact version from `rust-toolchain.toml` (decision
        # DEC-050) rather than pulling whatever `stable` is today, so CI
        # tests with the compiler releases are built with.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # Keyed on the lockfile *and* the compiler version, and it prunes
      # registry sources and stale build output rather than carrying an
      # ever-growing `target` between runs. The hand-rolled cache this
      # replaced kept whole `target` directories that only grew, which on
      # Windows cost more to restore than the compile it saved.
      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Build and test
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    # PRD acceptance suite AC-RUST-FOUNDATION requires the workspace to build
    # and pass on Windows, macOS, and Linux. Linux is what every change is
    # held to; the other two are `cross-platform.yml`, run before a release
    # and whenever a change touches paths, filesystem behavior, process
    # handling, or time.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # Reads the exact version from `rust-toolchain.toml` (decision
        # DEC-050) rather than pulling whatever `stable` is today, so CI
        # tests with the compiler releases are built with.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No separate `cargo build` step: `cargo test` builds the same targets,
      # and running both meant resolving and fingerprinting the workspace
      # twice for one set of artifacts.
      - name: Run the test suite
        run: cargo test --workspace --all-targets --locked

      # Doc tests are not covered by `--all-targets`, and the conformance
      # suite's documented example is one.
      - name: Run the doc tests
        run: cargo test --workspace --doc --locked

      - name: Smoke-test the hrc executable
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --bin hrc -- --version
          cargo run --locked --quiet --bin hrc -- --help > /dev/null

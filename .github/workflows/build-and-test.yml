name: Build and test

# The PRD traceability workflow runs on `pull_request_target` so it can
# execute trusted base-branch code (PRD decision DEC-014). This workflow
# compiles and runs pull-request code, so it deliberately uses the untrusted
# `pull_request` trigger with a read-only token instead.
#
# Routine verification runs on a self-hosted runner. The GitHub-hosted
# three-platform matrix still exists and is still what PRD acceptance suite
# AC-RUST-FOUNDATION requires, but it is now triggered on demand rather than
# on every push: see decision DEC-048.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_matrix:
        description: Also run the GitHub-hosted Linux, macOS, and Windows matrix
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  # A self-hosted runner is one machine. Superseded runs are cancelled so a
  # queue cannot build up behind a branch that has already moved on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Registry dependencies build with `--cap-lints allow`, so this denies
  # warnings in workspace crates only.
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Format, lint, build, and test
    # One job rather than two, because a self-hosted runner is a single
    # machine: splitting them would serialize anyway and pay the checkout and
    # dependency-resolution cost twice.
    runs-on: [self-hosted, windows]
    defaults:
      run:
        # Bash, from the Git for Windows installation the runner already
        # needs. Neither PowerShell option works unconfigured here: `pwsh` is
        # a separate install, and `powershell` runs the temporary script
        # files Actions generates, which the default execution policy blocks.
        # Bash also brings `set -eo pipefail`, so a failing command in a
        # multi-line step fails the step.
        shell: bash
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # No dependency cache step here on purpose. A self-hosted runner keeps
      # its own `target` directory and cargo registry between runs, so
      # restoring an archive over the top of them is slower than the
      # incremental build it replaces.

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the workspace
        run: cargo build --workspace --all-targets --locked

      - name: Run the test suite
        run: cargo test --workspace --locked

      - name: Smoke-test the hrc executable
        run: |
          cargo run --locked --quiet --bin hrc -- --version
          cargo run --locked --quiet --bin hrc -- --help > /dev/null

  hosted-matrix:
    name: Build and test (${{ matrix.os }})
    # PRD acceptance suite AC-RUST-FOUNDATION requires the workspace to build
    # and the CLI contract tests to pass on Windows, macOS, and Linux. That
    # is still the standard; this job is how it is met, run deliberately
    # rather than on every push while hosted minutes are scarce.
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Build the workspace
        run: cargo build --workspace --all-targets --locked

      - name: Run the test suite
        run: cargo test --workspace --locked

      - name: Smoke-test the hrc executable
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --bin hrc -- --version
          cargo run --locked --quiet --bin hrc -- --help > /dev/null

name: Build and test

# The PRD traceability workflow runs on `pull_request_target` so it can
# execute trusted base-branch code (PRD decision DEC-014). This workflow
# compiles and runs pull-request code, so it deliberately uses the untrusted
# `pull_request` trigger with a read-only token instead.
#
# The test job runs on all three platforms. It did not always: while this
# repository was private every minute was billed, and the platforms are not
# billed equally — Linux at the base rate, Windows twice it, macOS ten times
# it — which put a full matrix at roughly two dollars a change. Decision
# DEC-049 traded cross-platform coverage for that, and the trade had a real
# cost: the Windows half of the plugin's install step shipped broken, because
# nothing on a pull request ever ran Windows, and it could not be reproduced
# on the PowerShell available locally either.
#
# Standard GitHub-hosted runners are free and unlimited on public
# repositories, so that trade no longer buys anything. The matrix is what
# public Rust projects run for good reason.
#
# `lint` stays on Linux alone: `cargo fmt` and `clippy` produce the same
# answer everywhere, so running them three times would cost time and tell
# nobody anything.
#
# A change that touches no Rust and no agent skill still runs none of it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Registry dependencies build with `--cap-lints allow`, so this denies
  # warnings in workspace crates only.
  RUSTFLAGS: -D warnings

jobs:
  # Decides what the rest of the run needs to do. Cheap: checkout and a diff.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - name: Check out enough history to diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Whether anything the Rust jobs read has changed. A schedule or a
          # manual run always builds: the point of those is to catch drift
          # that no diff would show, such as a dependency yanked upstream.
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"

          # `.agents/` is in this list because the skill contract tests read
          # SKILL.md, so a skill-only change really can fail the suite.
          # `docs/` is not: nothing under it is read at test time.
          if echo "$changed" | grep -Eq '^(crates/|Cargo\.toml|Cargo\.lock|rust-toolchain|\.agents/|\.github/workflows/build-and-test\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No Rust, manifest, or agent-skill changes; skipping the build."
          fi

  lint:
    name: Format and lint
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        # Reads the exact version from `rust-toolchain.toml` (decision
        # DEC-050) rather than pulling whatever `stable` is today, so CI
        # tests with the compiler releases are built with.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # Keyed on the lockfile *and* the compiler version, and it prunes
      # registry sources and stale build output rather than carrying an
      # ever-growing `target` between runs. The hand-rolled cache this
      # replaced kept whole `target` directories that only grew, which on
      # Windows cost more to restore than the compile it saved.
      - name: Cache cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # PRD acceptance suite AC-RUST-FOUNDATION requires the workspace to build
    # and pass on Windows, macOS, and Linux. Every change is now held to all
    # three rather than to Linux with the others run by hand.
    name: Build and test (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is the interesting case, and cancelling the
      # others would hide whether the failure is specific to it or general.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        # Reads the exact version from `rust-toolchain.toml` (decision
        # DEC-050) rather than pulling whatever `stable` is today, so CI
        # tests with the compiler releases are built with.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Per-platform, because artifacts from one operating system are
          # useless to another and a shared key would have them evicting
          # each other on every run.
          shared-key: test-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No separate `cargo build` step: `cargo test` builds the same targets,
      # and running both meant resolving and fingerprinting the workspace
      # twice for one set of artifacts.
      - name: Run the test suite
        run: cargo test --workspace --all-targets --locked

      # Doc tests are not covered by `--all-targets`, and the conformance
      # suite's documented example is one.
      - name: Run the doc tests
        run: cargo test --workspace --doc --locked

      - name: Smoke-test the hrc executable
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --bin hrc -- --version
          cargo run --locked --quiet --bin hrc -- --help > /dev/null

  # One check to require, whatever the matrix does underneath.
  #
  # Branch protection names a status check as a string. Without this job, the
  # three matrix jobs would report as `Build and test (linux)` and friends,
  # the required `Build and test` would never report again, and every pull
  # request would block forever — including the one making the change.
  # Adding a platform later would need the ruleset edited in lockstep; this
  # way it does not.
  #
  # `if: always()` so it reports even when the matrix was skipped. A required
  # check that simply never arrives is indistinguishable from one still
  # running, and merges wait on it.
  gate:
    name: Build and test
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to have passed
        env:
          RUST: ${{ needs.plan.outputs.rust }}
          RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUST" != "true" ]; then
            echo "No Rust, manifest, or agent-skill changes; nothing to build."
            exit 0
          fi

          # `needs.<job>.result` for a matrix job is the aggregate: `success`
          # only when every leg succeeded.
          if [ "$RESULT" != "success" ]; then
            echo "At least one platform did not pass (aggregate result: $RESULT)." >&2
            exit 1
          fi

          echo "Linux, Windows and macOS all passed." 

name: PRD traceability

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-prd:
    name: PRD traceability
    # Self-hosted, like the rest of CI. The validator is PowerShell, which is
    # native here, and it only ever reads: it checks out the trusted base
    # revision and fetches the pull request's objects without building or
    # running any of them (decision DEC-014).
    runs-on: [self-hosted, windows]

    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch untrusted pull request objects
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/$env:PR_NUMBER/head"

      - name: Validate living PRD
        shell: pwsh
        run: >
          .github/scripts/check-prd-traceability.ps1
          -BaseSha '${{ github.event.pull_request.base.sha }}'
          -HeadSha '${{ github.event.pull_request.head.sha }}'
          -EventPath '${{ github.event_path }}'
